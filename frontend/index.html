<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EN -&gt; HI Voice Translator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --danger: #f85149;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 720px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .sub { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
      .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
      button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button.stop { background: var(--danger); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status {
        font-size: 13px;
        color: var(--muted);
        margin-left: auto;
      }
      .status .dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--muted);
        margin-right: 6px;
        vertical-align: middle;
      }
      .status.recording .dot { background: var(--danger); animation: pulse 1.2s infinite; }
      .status.playing .dot { background: var(--accent); }
      @keyframes pulse { 50% { opacity: 0.3; } }

      .panel {
        background: #0d1117;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        margin-top: 12px;
      }
      .label { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 6px; }
      .line { font-size: 15px; min-height: 22px; word-break: break-word; }
      .hindi { font-size: 17px; }

      .latency {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-top: 12px;
      }
      .latency span b { color: var(--text); font-weight: 600; }
      .errors { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>English -&gt; Hindi voice translator</h1>
      <div class="sub">Speak English. Pause. Hear Hindi.</div>

      <div class="controls">
        <button id="startBtn">Start recording</button>
        <button id="stopBtn" class="stop" disabled>Stop</button>
        <div id="status" class="status"><span class="dot"></span><span id="statusText">idle</span></div>
      </div>

      <div class="panel">
        <div class="label">English (ASR)</div>
        <div id="english" class="line"></div>
      </div>

      <div class="panel">
        <div class="label">Hindi (translation)</div>
        <div id="hindi" class="line hindi"></div>
      </div>

      <div class="latency">
        <span>ASR <b id="lat-asr">-</b> ms</span>
        <span>Translate <b id="lat-tr">-</b> ms</span>
        <span>TTS first chunk <b id="lat-tts">-</b> ms</span>
        <span>Total <b id="lat-total">-</b> ms</span>
      </div>

      <div id="errors" class="errors"></div>

      <audio id="audio" autoplay playsinline></audio>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
